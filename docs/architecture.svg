<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-labelledby="title desc">
<title id="title">Gemini Raycast Adapter data flow</title><desc id="desc">Raycast AI Chat connects to a loopback adapter, which calls Google's official APIs. Raycast executes its client tools. The adapter saves native context, source records and usage locally.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="600" height="470" rx="16" fill="#f8fafc"/>
<g font-family="system-ui,-apple-system,sans-serif" text-anchor="middle" fill="#0f172a">
<rect x="90" y="24" width="420" height="80" rx="12" fill="white" stroke="#cbd5e1"/><text x="300" y="56" font-size="22" font-weight="650">Raycast AI Chat</text><text x="300" y="82" font-size="15">Questions · files · client-tool execution</text>
<path d="M300 110 V158" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="325" y="119" width="176" height="26" fill="#f8fafc"/><text x="410" y="138" font-size="14" fill="#475569">HTTP / compatible SSE</text>
<rect x="45" y="168" width="510" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="300" y="204" font-size="22" font-weight="650">Local Gemini Adapter</text><text x="300" y="232" font-size="16">127.0.0.1:18767 · native tool routing</text><text x="300" y="258" font-size="15">Private context · source ledger · usage</text>
<path d="M300 291 V338" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="411" y="319" font-size="14" fill="#475569">Official APIs / HTTPS</text>
<rect x="45" y="348" width="510" height="96" rx="12" fill="white" stroke="#cbd5e1"/><text x="300" y="382" font-size="22" font-weight="650">Google Gemini</text><text x="300" y="410" font-size="15">Search · webpages · Maps · Python · vision · video</text>
</g></svg>
